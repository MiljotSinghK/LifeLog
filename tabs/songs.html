<html>
    <head>
        <title>LifeLog -Songs</title>
        <link href="common.css" rel="stylesheet">
        <meta name="viewport" content="width=device-width">
        <style>
            body{background-color: lightcoral;}
        </style>
    </head>
    <body>
        <span class="title">Songs</span>
        <button id="go_back" class="category_button">Go Back</button>
        <label id="dark_mode"><input type="checkbox" id="dark">  Dark Mode</label>
        <br><br><hr>
        <div class="category" style="visibility:visible;">
        <div class="flex_category" id="navbar" >

        </div>                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
        </div>
        <form id="songs">
        <div class="welcome">
            
            <div style="height:100px;width:100px;background-color: lightcoral;">
                <button id="add_new">+</button>
            </div>
            
            <div class="lists" >
            <li class="song"  type="1">
                    <input id="text_box" placeholder="Skyfall ,Royalty..." class="textbox">
                    <div id="icons"><button id="delete"><img src="../Icons/blueDeleteIcon.png"></button></button> </div>
                </li>
            </div>
            <!-- <button type="submit" id="done_rem">Done</button> -->
        </div>
        </form>
        
        <script src="common.js"></script>
        <script>
            console.log(person_data);

            let add_button=document.getElementById("add_new");
    let add_rem=function(){
    let new_element=document.createElement("li");
    new_element.type="1";
    new_element.className="song";
    new_element.innerHTML='<input id="text_box" placeholder="..." class="textbox" ><div id="icons"><button id="delete"><img src="../Icons/blueDeleteIcon.png"> </div>';
    document.querySelector(".lists").appendChild(new_element);
    }

add_button.addEventListener("click",add_rem);

let list_cont=document.querySelector(".lists");
list_cont.addEventListener("click",function(e){
    let target=e.target;
    if (target.closest("input")){
        let all_rems=document.querySelectorAll("#text_box");
       if (target===all_rems[all_rems.length-1]){
        add_rem();
       }
    }
    else if (target.closest("button") || target.closest("img")){
        
        if (target.closest("button").id=="delete"){
            
            target.closest("li").remove();
            dynamic();
        }            
        }
})  

    add_button.addEventListener("mouseenter",()=>{
        add_button.style.transform="scale(4.05,4.05)";
        add_button.closest("div").style.transform="scale(1.05,1.05)";
    })
    add_button.addEventListener("mouseleave",()=>{
        add_button.style.transform="scale(4.0,4.0)";
        add_button.closest("div").style.transform="scale(1,1)";
    })

    let songs=person_data.songs || [] ;
    console.log(songs);
    if (songs[songs.length-1]==''){
        songs.pop()
    }
    console.log(songs);
    for (let i=0;i<songs.length;i++){
        add_rem();
        document.querySelectorAll(".textbox")[i].value=songs[i];
    }
    let submit=document.getElementById("songs");
    submit.addEventListener("submit",function(e){
        e.preventDefault();
        e.stopPropagation();
        
    })
    let dynamic =function(){
        songs=document.querySelectorAll(".textbox");
        songs=Array.from(songs).map(x=>x.value);
        person_data.songs=songs;
        localStorage.setItem("person_data"+person_no,JSON.stringify(person_data));
    }
    submit.addEventListener("input",function(e){
        let impact=e.target;
        dynamic();     

    })
        </script>
    </body>
    </html>
